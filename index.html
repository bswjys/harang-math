<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공부하랑핑 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="김하랑의 1학년 수학 공부 앱 — 공부하랑핑">
<meta name="theme-color" content="#ff86c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부하랑핑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="bg-deco" aria-hidden="true">
  <span style="--x:6%;--y:12%;--d:0s">💖</span>
  <span style="--x:88%;--y:8%;--d:1.2s">✨</span>
  <span style="--x:16%;--y:72%;--d:.6s">🌸</span>
  <span style="--x:92%;--y:58%;--d:2.1s">💗</span>
  <span style="--x:48%;--y:94%;--d:1.7s">⭐</span>
  <span style="--x:76%;--y:88%;--d:.9s">🍊</span>
</div>

<header class="topbar">
  <div class="topbar-main">
    <div class="brand">
      <span class="brand-heart">💖</span>
      <h1>공부하랑핑</h1>
      <span class="brand-spark">✨</span>
    </div>
    <div class="status-actions">
      <button class="icon-btn" id="wishBoxBtn" type="button" aria-label="소원 쿠폰함 열기">
        🎁<span class="badge" id="wishBadge" hidden>0</span>
      </button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="효과음 켜기/끄기">🔊</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="chip-row">
      <div class="chip level" id="levelChip" title="하랑핑 칭호">
        <span class="chip-emoji" id="levelEmoji">🌱</span>
        <span id="levelName">새싹 하랑핑</span>
      </div>
      <div class="chip orange" id="orangeChip">
        <span class="orange-emoji">🍊</span>
        <span id="orangeCount">0</span><span class="slash">/</span><span>100</span>
      </div>
      <span class="combo" id="comboChip" hidden>🔥 콤보 2</span>
    </div>
    <div class="progress" role="progressbar" aria-label="감 모은 개수" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressOuter">
      <div class="progress-fill" id="progressBar"></div>
      <div class="progress-shine" aria-hidden="true"></div>
    </div>
    <div class="todaybar">
      <span id="todayProgress">오늘 0문제 · 다음 칭호까지 10개</span>
    </div>
  </div>
</header>

<main class="app">
  <section class="card question-card" id="questionCard">
    <div class="qmeta">
      <span class="tag" id="qTag">더하기</span>
      <span class="qnum" id="qNum">1번째 문제</span>
    </div>

    <div class="stage" id="questionStage"></div>

    <div class="answers" id="answerGrid"></div>

    <div class="hint-row" id="hintRow" hidden>
      <button class="hint-btn" id="hintBtn" type="button">그림 힌트 보기 🍬</button>
    </div>
    <div class="hint-area" id="hintArea" hidden></div>

    <div class="feedback" id="feedback" hidden>
      <div class="fb-head">
        <span class="fb-emoji" id="fbEmoji">🎉</span>
        <div>
          <p class="fb-title" id="fbTitle">김하랑 천재다! 🎉</p>
          <p class="fb-sub" id="fbSub">정답이에요! 감 1개를 모았어요 🍊</p>
        </div>
      </div>
      <div class="fb-explain" id="fbExplain"></div>
      <div class="fb-actions" id="fbActions"></div>
    </div>
  </section>

  <p class="foot-note">틀려도 괜찮아! 해설을 보면 머리가 반짝반짝 좋아져요 ✨</p>
</main>

<!-- 소원 팝업 -->
<div class="modal" id="wishModal" hidden>
  <div class="modal-card confetti-card" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
    <div class="modal-hearts" aria-hidden="true">🎉💖✨🍊🎁</div>
    <h2 id="wishTitle">축하해요 김하랑!<br>감 100개 다 모았어요! 🎉</h2>
    <p class="modal-lead">엄마 아빠에게 소원 말하기 🎁</p>

    <div class="wish-saved" id="wishSavedBox" hidden>
      <p class="wish-saved-title">소원 쿠폰함에 저장했어요! 💌</p>
      <p class="wish-saved-wish" id="wishSavedText"></p>
      <p class="wish-saved-note">엄마 아빠에게 보여 주세요 💖</p>
    </div>

    <div class="wish-form" id="wishForm">
      <label class="wish-label" for="wishInput">내가 말하고 싶은 소원</label>
      <input class="wish-input" id="wishInput" type="text" maxlength="60" placeholder="예) 아이스크림 사주세요 🍦" autocomplete="off">
      <div class="wish-chips" id="wishChips"></div>
      <button class="btn btn-primary big" id="wishSaveBtn" type="button">이 소원 말할래요 💌</button>
    </div>

    <button class="btn btn-ghost small" id="wishCloseBtn" type="button" hidden>공부 계속하기 💖</button>
  </div>
</div>

<!-- 소원 쿠폰함 -->
<div class="modal" id="couponModal" hidden>
  <div class="modal-card coupon-card" role="dialog" aria-modal="true" aria-labelledby="couponTitle">
    <button class="modal-x" id="couponClose" type="button" aria-label="닫기">✕</button>
    <h2 id="couponTitle">🎁 소원 쿠폰함</h2>
    <p class="modal-lead small-lead">엄마 아빠가 <b>소원 들어줬어요 ✅</b>를 눌러 주세요</p>
    <div class="coupon-list" id="couponList"></div>
    <div class="coupon-foot" id="couponFoot"></div>
  </div>
</div>

<!-- 칭호 레벨업 토스트 -->
<div class="levelup-toast" id="levelToast" hidden>
  <span class="lv-emoji" id="lvEmoji">✨</span>
  <div>
    <p class="lv-small">새 칭호를 얻었어요!</p>
    <p class="lv-name" id="lvName">반짝 하랑핑</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
